[project]
name = "kerto"
version = "0.0.1"
description = "Equipo de producción musical open source para Claude Code: beat, voz, autotune, mezcla y master."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "mido>=1.3.3",
    "pretty-midi>=0.2.11.post0",
    "pyyaml>=6.0.3",
]

[project.scripts]
kerto = "kerto.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]
